name: Release

# n8n verified community nodes must be published from CI with npm provenance
# (required since May 2026). Create a GitHub Release to publish.
#
# Publishing uses npm trusted publishing (OIDC) — no token needed. The package's
# npmjs.com settings must list this repo + workflow file as a trusted publisher.
# Provenance is generated automatically with trusted publishing.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing requires npm >= 11.5.1; Node 22 ships npm 10
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npm publish --access public
